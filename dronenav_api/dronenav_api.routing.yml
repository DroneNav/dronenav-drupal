dronenav_api.gateway.sites:
  path: '/api-gateway/sites'
  defaults:
    _controller: '\Drupal\dronenav_api\Controller\SiteGatewayController::list'
  requirements:
    _permission: 'access dronenav api gateway'
  methods: [GET]
dronenav_api.gateway.site:
  path: '/api-gateway/sites/{site_id}'
  defaults:
    _controller: '\Drupal\dronenav_api\Controller\SiteGatewayController::get'
  requirements:
    _permission: 'access dronenav api gateway'
    site_id: '[0-9a-fA-F-]+'
  methods: [GET]
dronenav_api.gateway.create_site:
  path: '/api-gateway/sites'
  defaults:
    _controller: '\Drupal\dronenav_api\Controller\SiteGatewayController::createSite'
  requirements:
    _permission: 'edit dronenav overlays'
  methods: [POST]
dronenav_api.gateway.update_site:
  path: '/api-gateway/sites/{site_id}'
  defaults:
    _controller: '\Drupal\dronenav_api\Controller\SiteGatewayController::updateSite'
  requirements:
    _permission: 'edit dronenav overlays'
    site_id: '[0-9a-fA-F-]+'
  methods: [PATCH]
dronenav_api.gateway.delete_site:
  path: '/api-gateway/sites/{site_id}'
  defaults:
    _controller: '\Drupal\dronenav_api\Controller\SiteGatewayController::delete'
  requirements:
    _permission: 'delete dronenav overlays'
    site_id: '[0-9a-fA-F-]+'
  methods: [DELETE]
