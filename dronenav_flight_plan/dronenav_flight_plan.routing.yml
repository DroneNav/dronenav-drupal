# dronenav_flight_plan.routing.yml
dronenav_flight_plan.list:
  path: '/flight-plans'
  defaults:
    _controller: '\Drupal\dronenav_flight_plan\Controller\FlightPlanController::list'
    _title: 'My Flight Plans'
  requirements:
    _permission: 'manage own dronenav flight plans'

dronenav_flight_plan.add:
  path: '/flight-plan/add'
  defaults:
    _controller: '\Drupal\dronenav_flight_plan\Controller\FlightPlanController::add'
    _title: 'File Flight Plan'
  requirements:
    _permission: 'file dronenav flight plans'

dronenav_flight_plan.add_via:
  path: '/flight-plan/add-via'
  defaults:
    _form: '\Drupal\dronenav_flight_plan\Form\FlightPlanViaForm'
    _title: 'File Via Flight Plan'
  requirements:
    _permission: 'file dronenav flight plans'

dronenav_flight_plan.via:
  path: '/flight-plan/{node}/via'
  defaults:
    _form: '\Drupal\dronenav_flight_plan\Form\FlightPlanViaForm'
    _title: 'Via Flight Plan'
  requirements:
    _permission: 'manage own dronenav flight plans'
  options:
    parameters:
      node:
        type: entity:node

dronenav_flight_plan.edit:
  path: '/flight-plan/{node}/edit'
  defaults:
    _entity_form: 'node.edit'
    _title: 'Edit VIA Flight Plan'
  requirements:
    _permission: 'manage own dronenav flight plans'
  options:
    parameters:
      node:
        type: entity:node

dronenav_flight_plan.edit_via:
  path: '/flight-plan/{node}/edit-via'
  defaults:
    _entity_form: 'node.edit-via'
    _title: 'Edit Flight Plan'
  requirements:
    _permission: 'manage own dronenav flight plans'
  options:
    parameters:
      node:
        type: entity:node

dronenav_flight_plan.delete:
  path: '/flight-plan/{node}/delete'
  defaults:
    _entity_form: 'node.delete'
    _title: 'Delete Flight Plan'
  requirements:
    _permission: 'manage own dronenav flight plans'
  options:
    parameters:
      node:
        type: entity:node

dronenav_flight_plan.submit:
  path: '/flight-plan/{node}/submit'
  defaults:
    _controller: '\Drupal\dronenav_flight_plan\Controller\FlightPlanController::submit'
    _title: 'Submit Flight Plan'
  requirements:
    _permission: 'manage own dronenav flight plans'
  options:
    parameters:
      node:
        type: entity:node

dronenav_flight_plan.map:
  path: '/flight-plan/{nid}/map'
  defaults:
    _controller: '\Drupal\dronenav_flight_plan\Controller\FlightPlanController::map'
    _title: 'Flight Plan Map'
  requirements:
    _permission: 'access content'
    node: '\d+'

dronenav_flight_plan.launch:
  path: '/flight-plan/{node}/launch'
  defaults:
    _controller: '\Drupal\dronenav_flight_plan\Controller\FlightPlanController::launch'
    _title: 'Launch Flight'
  requirements:
    _permission: 'access content'
    node: '\d+'

dronenav_flight_plan.cancel:
  path: '/flight-plan/{node}/cancel'
  defaults:
    _controller: '\Drupal\dronenav_flight_plan\Controller\FlightPlanController::cancel'
  requirements:
    _permission: 'manage own dronenav flight plans'
    node: '\d+'

dronenav_flight_plan.status_callback:
  path: '/api/flight-plans/status-callback'
  defaults:
    _controller: '\Drupal\dronenav_flight_plan\Controller\FlightStatusCallbackController::receive'
  methods: [POST]
  requirements:
    _access: 'TRUE'

dronenav_flight_plan.statuses:
  path: '/flight-plans/statuses'
  defaults:
    _controller: '\Drupal\dronenav_flight_plan\Controller\FlightPlanStatusController::statuses'
  requirements:
    _user_is_logged_in: 'TRUE'
  methods: [GET]

